<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clipstorm</title>
<link rel="icon" type="image/svg+xml" href="/brand/favicon.svg?v=3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Inter:wght@300&family=Archivo+Black&family=Anton&family=Poppins:wght@800&display=swap" rel="stylesheet">
<style>
:root{
  /* One theme: dark. Ratios below are WCAG 2.2 (L1+.05)/(L2+.05) on --bg #0A0A0A.
       --text  #F5F5F5   18.16    --dim  #A3A3A3   7.85
       --faint #7C7C7C   4.74     --brand #FF8B33  8.48
       --brand-deep #FFB27A   11.22   --good #34D399  10.30 (8.01 on good-soft)   --bad #F87171  7.16 */
  --brand:#FF8B33;--brand-press:#F27A1F;--brand-ink:#160D05;--brand-soft:#2A1B10;--brand-line:#4A2E18;--brand-deep:#FFB27A;
  --frame:#000000;--frame-2:#0F0F0F;--frame-line:rgba(255,255,255,.08);--frame-text:#F5F5F5;--frame-dim:#8A8A8A;
  --bg:#0A0A0A;--card:#111111;--field:#141414;--muted:#111111;--line:#1E1E1E;--line-2:#2A2A2A;
  --text:#F5F5F5;--ink:#F5F5F5;--dim:#A3A3A3;--faint:#7C7C7C;
  --good:#34D399;--good-soft:#0B2A1E;--bad:#F87171;--bad-soft:#2B1416;--live:#EF4444;
  --r-lg:16px;--r:12px;--r-sm:8px;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--frame);color:var(--text);font:14px/1.5 "Geist","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
h1,h2,h3,h4,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
svg{width:18px;height:18px;flex:none;fill:currentColor}
::selection{background:var(--brand-line)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#2E2E2E;border-radius:999px;border:3px solid var(--bg)}

/* ---------- frame */
.app{display:grid;grid-template-columns:240px minmax(0,1fr);height:100vh}
.side{background:var(--frame);color:var(--frame-text);display:flex;flex-direction:column;height:100vh;padding:14px 10px 12px;min-width:0}
.side-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 4px 22px 6px}
.side-head .logo{height:36px;width:auto;display:block}
.side-head .mark{display:none;width:34px;height:34px}
.icon-btn{width:36px;height:36px;display:grid;place-items:center;border-radius:var(--r);border:0;background:transparent;color:var(--dim);cursor:pointer;flex:none}
.side .icon-btn{color:var(--frame-dim)}
.icon-btn:active{background:var(--muted)}.side .icon-btn:active{background:var(--frame-2)}
.nav{display:flex;flex-direction:column;gap:1px;overflow-y:auto;flex:1;min-height:0;scrollbar-width:thin;scrollbar-color:var(--line-2) transparent;overscroll-behavior:contain}
.nav::-webkit-scrollbar{display:none}
.nav h4{font-size:12px;font-weight:500;color:var(--frame-dim);padding:6px 10px 1px}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;min-height:28px;padding:0 10px;border-radius:7px;border:0;background:transparent;color:var(--frame-text);font-size:14px;font-weight:500;cursor:pointer;text-align:left}
.nav-item svg{width:17px;height:17px}
.nav-item svg{color:var(--frame-dim)}
.nav-item:active{background:var(--frame-2)}
.nav-item.on{background:var(--brand);color:var(--brand-ink);font-weight:600}
.nav-item.on svg{color:var(--brand-ink)}
.label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.count{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:rgba(255,255,255,.1);color:var(--text);white-space:nowrap}
.nav-item.on .count{background:rgba(42,26,18,.14);color:var(--brand-ink)}
.avatar{width:26px;height:26px;border-radius:50%;background:rgba(255,139,51,.18);color:#FFB27A;display:grid;place-items:center;font-size:11px;font-weight:700;flex:none;overflow:hidden}
img.avatar{object-fit:cover;background:rgba(255,255,255,.08)}
.tav{width:34px;height:34px;border-radius:50%;object-fit:cover;flex:none;background:var(--muted)}
#title{display:flex;align-items:center;gap:10px}
.chprev{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:var(--muted);animation:rise .25s ease both}
.chprev img,.chprev .ph{width:44px;height:44px;border-radius:50%;object-fit:cover;flex:none;background:#EFE7E1}
.chprev b{display:block;font-size:14px;color:var(--text)}
.chprev span{font-size:12px;color:var(--faint)}
.chprev.bad{background:#FDECEC;color:#A12A2A;font-size:13px}
.chprev .sk{width:120px}
.nav-item.on .avatar{background:var(--brand-ink);color:var(--brand)}
.nav-item.on img.avatar{background:var(--brand-ink)}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--live);animation:pulse 1.3s infinite;flex:none}
.side-foot{display:flex;flex-direction:column;gap:2px;padding-top:12px;border-top:1px solid var(--frame-line)}
.side-card{background:var(--frame-2);border-radius:var(--r);padding:12px 14px;margin-top:8px;font-size:12px;color:var(--frame-dim);display:flex;flex-direction:column;gap:7px}
.side-card div{display:flex;align-items:center;gap:9px}
.led{width:7px;height:7px;border-radius:50%;background:#3DDC97;flex:none}.led.no{background:#FF6B78}.led.mid{background:var(--brand)}
.plans-btn{margin-top:10px;width:100%;background:var(--frame-text);color:var(--brand-ink);border:0}
.scrim{display:none}

main{background:var(--bg);margin:8px 8px 8px 0;border-radius:var(--r-lg);height:calc(100vh - 16px);overflow-y:auto;min-width:0;scrollbar-gutter:stable}
.topbar{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:10px 28px;min-height:54px;border-bottom:1px solid transparent;transition:border-color .2s ease}
.topbar.stuck{border-color:var(--line)}
#vbanner:empty{display:none}
.upd{display:grid;gap:14px}
.upd ul{margin:0;padding-left:18px;display:grid;gap:4px;font-size:13px;color:var(--text);max-height:180px;overflow:auto}
.upd ul small{color:var(--dim)}
.upd .cmd{display:flex;gap:8px;align-items:center}
.upd .cmd code{flex:1;min-width:0;overflow-wrap:anywhere;font-size:12px;background:var(--muted);border-radius:8px;padding:9px 11px}
.upd h3{font-size:13px;font-weight:600;color:var(--text);margin:0}
.vb{display:flex;align-items:center;gap:12px;margin:12px 28px 0;padding:12px 12px 12px 16px;border-radius:12px;background:#2A1B10;color:#FFD9BC;font-size:14px;animation:rise .3s ease both}
.vb svg{width:18px;height:18px;flex:none;color:var(--brand-deep)}
.vb span{flex:1;min-width:0}
.vb b{color:var(--brand-deep)}
@media (max-width:640px){.vb{margin:10px 16px 0;flex-wrap:wrap}}
.topbar .titles{flex:1;min-width:0}
#tpic:empty{display:none}
#tpic img,#tpic .avatar{width:42px;height:42px;border-radius:50%;object-fit:cover;display:block;font-size:15px}
#tpic span.avatar{background:var(--brand-soft);color:var(--brand-deep);display:grid;place-items:center;font-weight:700}
#tpic.live img,#tpic.live .avatar{padding:2px;background:var(--bg);border:2px solid #E5323F}
.topbar.tabbed{border-color:var(--line)}
.topbar.tabbed .titles{flex:0 1 auto;max-width:34%}
.topbar.tabbed #actions{margin-left:auto}
.utabs:empty{display:none}
.utabs{display:flex;gap:2px;padding:3px;background:var(--muted);border-radius:11px;overflow-x:auto;scrollbar-width:none}
@media (min-width:761px){.topbar.tabbed{position:sticky}.topbar.tabbed .utabs{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}.topbar.tabbed .titles{max-width:calc(50% - 230px)}}
@media (max-width:760px){.utabs{order:5;flex-basis:100%;margin:2px 0 0;position:relative}.topbar.tabbed .titles{max-width:none;flex:1}}
.utabs .tabbtn{height:34px;padding:0 14px;border-radius:8px;background:transparent;color:var(--dim);font-size:13px;transition:background-color .18s ease,color .18s ease}
.utabs .tabbtn:hover{background:var(--brand-soft);color:var(--text)}
.utabs .tabbtn::after{display:none}
.utabs .tabbtn.on{background:var(--brand-soft);color:var(--text)}
.utabs .tabbtn{position:relative;z-index:1}
.utabs .ind{position:absolute;top:3px;bottom:3px;left:0;border-radius:8px;background:var(--brand);z-index:0;transition:transform .32s cubic-bezier(.3,.7,.2,1),width .32s cubic-bezier(.3,.7,.2,1)}
.utabs .tabbtn,.utabs .tabbtn svg,.utabs .tabbtn .n{transition:color .25s ease,background-color .25s ease}
.utabs .tabbtn.on svg{color:var(--brand-deep)}
.utabs .tabbtn .n{background:var(--muted);color:var(--dim)}
.utabs .tabbtn.on .n{background:rgba(255,255,255,.12);color:var(--text)}
.rdot{flex:none;width:9px;height:9px;border-radius:50%;background:#fff}
.btn .rdot.on{background:#E5323F;animation:pulse 1.3s infinite}
/* live stream panel */
.stream{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(250px,1fr);gap:14px;background:#1E1612;border-radius:16px;padding:12px;margin-bottom:22px;color:#EFE5DE;animation:rise .3s ease both}
.stream .player{position:relative;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:#000}
.stream iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.noembed{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:20px;text-align:center;background:#120D0A;color:#EFE5DE}
.noembed .logo{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;margin-bottom:4px}
.noembed .logo svg{width:22px;height:22px}
.noembed b{font-size:15px;color:#fff}
.noembed span{font-size:13px;color:#B9A597;max-width:380px}
.noembed .btn{margin-top:6px}
.sinfo{display:flex;flex-direction:column;gap:12px;padding:6px 6px 4px 2px;min-width:0}
.sinfo .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sinfo .logo{flex:none;width:28px;height:28px;border-radius:8px;display:grid;place-items:center}
.sinfo .logo svg{width:16px;height:16px}
.sinfo .lv{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;background:#C81E28;color:#fff;padding:3px 10px;border-radius:999px}
.sinfo .lv i{width:6px;height:6px;border-radius:50%;background:#fff;animation:pulse 1.3s infinite}
.sinfo h3{font-size:16px;line-height:1.4;font-weight:600;color:#fff;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.sinfo .by{font-size:12px;color:#B9A597;margin-top:-6px}
.sstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:8px}
.sstats div{background:rgba(255,255,255,.06);border-radius:10px;padding:10px 12px}
.sstats b{display:block;font-size:17px;font-weight:700;color:#fff;letter-spacing:-.01em}
.sstats span{font-size:11px;color:#B9A597}
.sinfo .cta{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.sinfo .cta .btn{height:46px;width:100%;justify-content:center;font-size:15px}
.sinfo .cta small{font-size:12px;color:#B9A597;text-align:center}
.splat{display:flex;gap:4px;margin-left:auto}
.splat button{display:grid;place-items:center;width:30px;height:30px;border:0;border-radius:8px;background:rgba(255,255,255,.06);color:#B9A597;cursor:pointer;transition:background-color .15s ease}
.splat button:hover{background:rgba(255,255,255,.12)}
.splat button.on{background:rgba(255,139,51,.22)}
.splat svg{width:15px;height:15px}
@media (max-width:960px){.stream{grid-template-columns:1fr}}
.sbadge{display:inline-flex;align-items:center;gap:6px;margin-top:3px;font-size:11px;font-weight:600;padding:2px 8px 2px 7px;border-radius:999px;background:var(--muted);color:var(--dim)}
.sbadge i{width:6px;height:6px;border-radius:50%;background:currentColor}
.sbadge.live{background:#FDECEC;color:#C53030}.sbadge.live i,.sbadge.rec i{animation:pulse 1.3s infinite}
.sbadge.rec{background:#C81E28;color:#fff}
.sbadge svg{width:12px;height:12px}
.sbadge{white-space:nowrap;max-width:100%}
.topbar .titles{overflow:hidden}
@media (max-width:560px){#tpic img,#tpic .avatar{width:36px;height:36px}.topbar #actions .btn[data-act=golive]{font-size:0;gap:0;width:38px;padding:0;justify-content:center}.topbar #actions .btn[data-act=golive] .rdot{width:12px;height:12px}}
.ttabs{display:inline-flex;gap:2px;padding:3px;background:var(--muted);border-radius:10px}
.ttabs .tabbtn{height:32px;padding:0 12px;border-radius:8px;font-size:13px;color:var(--dim)}
.ttabs .tabbtn::after{display:none}
.ttabs .tabbtn svg{width:16px;height:16px}
.ttabs .tabbtn:hover{background:var(--brand-soft);color:var(--text)}
.ttabs .tabbtn.on{background:var(--brand-soft);color:var(--text)}
.ttabs .tabbtn.on .n{background:#fff}
#actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
#actions a.btn{text-decoration:none}
@media (max-width:560px){#actions .btn .long{display:none}}
@media (max-width:900px){.ttabs .tabbtn .lbl{display:none}.ttabs .tabbtn{padding:0 10px}}
/* channels in Setup */
.chans{display:flex;flex-direction:column;gap:8px}
.chan{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:var(--muted);min-height:64px}
.chan .logo{flex:none;width:36px;height:36px;border-radius:10px;display:grid;place-items:center}
.chan .logo svg{width:20px;height:20px}
.chan .pic{flex:none;width:40px;height:40px;border-radius:50%;object-fit:cover;background:#EFE7E1}
.chan .who{flex:1;min-width:0}
.chan .who b{display:block;font-size:14px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chan .who span{font-size:12px;color:var(--faint)}
.chan input{flex:1;min-width:0}
.chan .main{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--dim);cursor:pointer;white-space:nowrap}
.chan .main input{accent-color:var(--brand);width:15px;height:15px;flex:none}
.chan .sbadge{margin:0}
@media (max-width:640px){.chan{flex-wrap:wrap}.chan .main{order:5}}
.topbar h1{font-size:15px;font-weight:600;letter-spacing:-.01em;color:var(--text)}
.topbar p{font-size:12px;color:var(--dim);margin-top:0;overflow-wrap:anywhere}
.icon-btn.menu{display:none}
.content{padding:28px 32px 72px;max-width:1280px;margin:0 auto}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1}

/* ---------- collapsed sidebar */
.app.mini{grid-template-columns:76px minmax(0,1fr)}
.app.mini .side-head{flex-direction:column;padding:2px 0 18px}
.app.mini .side-head .logo{display:none}.app.mini .side-head .mark{display:block}
.app.mini .label,.app.mini .count,.app.mini .nav h4,.app.mini .side-card,.app.mini .plans-btn{display:none}
.app.mini .nav-item{justify-content:center;padding:0}
.app.mini .nav-item .live-dot{position:absolute;margin:-20px -22px 0 0}
.avatar.ring{border:2px solid #E5323F;padding:1px;background-clip:content-box}
img.avatar.ring{background:transparent}
.sb-tag{margin-left:auto;display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:#FF8A8A;background:rgba(229,50,63,.16);padding:1px 7px 1px 6px;border-radius:5px}
.sb-tag i{width:6px;height:6px;border-radius:50%;background:currentColor;animation:pulse 1.3s infinite}
.sb-tag.rec{background:#C81E28;color:#fff}
.nav-item.on .sb-tag{background:#C81E28;color:#fff}
.app.mini .sb-tag{display:none}

/* ---------- buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 14px;border-radius:var(--r);border:1px solid var(--line-2);background:var(--bg);color:var(--text);cursor:pointer;text-decoration:none;white-space:nowrap;font-weight:600}
.btn:active{background:var(--muted)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:active{background:var(--brand-press);border-color:var(--brand-press)}
.btn.dark{background:var(--brand-ink);border-color:var(--brand-ink);color:#fff}
.btn.dark svg{color:var(--brand)}
.btn.danger{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--dim)}
.btn.sm{height:32px;padding:0 11px;font-size:13px;gap:6px}
.btn.sm svg{width:16px;height:16px}
.btn.icon{width:32px;padding:0}
.btn.lg{height:44px;padding:0 20px;font-size:15px}
.btn:disabled{opacity:.45;cursor:default;pointer-events:none}

/* ---------- fields */
:where(input:not([type=checkbox],[type=radio],[type=file],[type=range]),select,textarea){width:100%;height:40px;padding:0 12px;background:var(--muted);border:1px solid var(--line-2);border-radius:var(--r-sm);min-width:0;outline:none;transition:border-color .15s ease}
:where(textarea){height:auto;padding:10px 12px;resize:vertical}
:where(input:not([type=checkbox],[type=radio],[type=file],[type=range]),select,textarea):hover{border-color:#D9CCC2}
:where(input:not([type=checkbox],[type=radio],[type=file],[type=range]),select,textarea):focus{background:var(--muted);border-color:var(--brand)}
input:not([type=checkbox],[type=radio],[type=range]):focus-visible,select:focus-visible,textarea:focus-visible{outline:none}
input::placeholder,textarea::placeholder{color:var(--faint)}
label.f{display:flex;flex-direction:column;gap:7px;font-size:12px;color:var(--dim);font-weight:600}
label.sw{display:flex;align-items:center;gap:12px;cursor:pointer;color:var(--text);font-weight:600}
label.sw input{appearance:none;width:38px;height:22px;border-radius:999px;background:var(--frame-2);position:relative;cursor:pointer;flex:none;margin:0}
label.sw input::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s}
label.sw input:checked{background:var(--brand)}label.sw input:checked::after{transform:translateX(16px)}
label.sw small{display:block;color:var(--dim);font-size:12px;font-weight:400}
label.ck{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 13px;border-radius:var(--r);cursor:pointer;background:var(--bg);border:1px solid var(--line-2);font-weight:500}
label.ck:has(input:checked){background:var(--brand-soft);border-color:var(--brand-line);color:var(--text)}
label.ck input{accent-color:var(--brand);margin:0}
[data-caption-style]:disabled{opacity:.45;cursor:default}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:18px}
.span{grid-column:1/-1}

/* ---------- surfaces */
.card{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:22px;margin-bottom:16px}
.card>h2,.card-head h2{font-size:15px;font-weight:600;color:var(--text)}
.card>h2{margin-bottom:4px}
.card>h2+.help{margin-bottom:18px}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.help,.sub{color:var(--dim);font-size:13px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:22px;overflow-x:auto;scrollbar-width:none}
.tabbtn{position:relative;display:inline-flex;align-items:center;gap:8px;height:46px;padding:0 14px;border:0;background:transparent;color:var(--faint);cursor:pointer;font-weight:600;font-size:14px;border-radius:10px 10px 0 0;white-space:nowrap}
.tabbtn svg{width:17px;height:17px}
.tabbtn .n{font-size:11px;font-weight:600;min-width:20px;padding:1px 7px;border-radius:999px;background:var(--muted);color:var(--dim);text-align:center;transition:background-color .15s ease,color .15s ease}
.tabbtn::after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:var(--brand);opacity:0}
.tabbtn.on{color:var(--text)}
.tabbtn.on::after{opacity:1;animation:tabin .28s ease}
.tabbtn.on .n{background:var(--brand-soft);color:var(--text)}
.tabbtn.on svg{color:var(--brand)}
@keyframes tabin{from{transform:scaleX(.3);opacity:0}to{transform:none;opacity:1}}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--muted);color:var(--dim);white-space:nowrap;text-decoration:none}
.pill.ok{color:var(--good);background:var(--good-soft)}
.pill.bad{color:var(--bad);background:var(--bad-soft)}
.pill.warn{color:var(--brand);background:var(--brand-soft)}
.pill.live{color:#fff;background:#C81E28} /* white on #EF4444 was 3.76:1; white on the deep red is 5.72:1 */
.pill.brand{color:var(--brand-ink);background:var(--brand)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;animation:pulse 1.3s infinite}
@keyframes pulse{50%{opacity:.3}}
.empty{border:1px dashed var(--line-2);border-radius:var(--r);padding:48px 20px;text-align:center;color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:4px}
.empty img{width:56px;height:56px;margin-bottom:12px}
.empty b{display:block;color:var(--text);font-size:15px;font-weight:600}

/* ---------- review queue */
.rv-job{display:flex;align-items:baseline;gap:12px;font-size:12px;color:var(--dim);font-weight:600}
.rv-job select{font-size:14px;color:var(--ink)}
.rv-list{display:flex;flex-direction:column;gap:12px}
.rv-card{display:flex;gap:16px;align-items:flex-start}
.rv-thumb{flex:none;width:88px;min-height:96px;aspect-ratio:9/16;border-radius:10px;background:var(--muted);overflow:hidden}
.rv-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.rv-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.rv-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rv-top .pill{margin-left:auto}
.rv-score{color:var(--brand-deep)}.rv-why{margin:0;font-size:13px;line-height:1.5;color:var(--dim)}.rv-why b{color:var(--text);font-weight:600}
.rv-acts .btn{min-height:40px;padding:0 18px;font-size:14px}

/* ---------- home hero + composer */
.hero{position:relative;padding:44px 28px 52px;text-align:center}
.hero .ga-bg{position:absolute;top:24px;bottom:-40px;left:0;width:100%;pointer-events:none;user-select:none;z-index:0;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0%,black 14%,black 70%,transparent 100%);mask-image:linear-gradient(to bottom,transparent 0%,black 14%,black 70%,transparent 100%)}
.hero>:not(.ga-bg){position:relative;z-index:2}
#view{position:relative;z-index:1}
.hero h2{font-size:clamp(21px,5.2vw,28px);font-weight:700;letter-spacing:-.03em;color:var(--text);line-height:1.2;text-wrap:balance}
.hero>p{color:var(--dim);margin:8px auto 22px;max-width:520px;font-size:15px}
.composer{max-width:760px;margin:0 auto;background:var(--bg);border:1px solid var(--line-2);border-radius:var(--r-lg);text-align:left;transition:background-color .15s ease,border-color .15s ease}
.composer:has(#url:focus){border-color:#FFB27A}
.composer.compact{max-width:none;margin-bottom:28px;background:var(--muted)}
.composer.over{background:var(--brand-soft);border-color:var(--brand)}
.composer :focus-visible{outline:none}
.composer-input{position:relative;display:flex;align-items:center}
.composer-input>svg{position:absolute;left:18px;color:var(--faint);width:20px;height:20px;transition:color .15s ease}
.composer-input:focus-within>svg{color:var(--brand)}
.composer-input input,.composer-input input:focus{height:60px;border:0;background:transparent;padding:0 18px 0 48px;font-size:16px;border-radius:var(--r-lg) var(--r-lg) 0 0}
.composer-bar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:2px 10px 10px 12px}
.chip{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 12px;border-radius:999px;border:0;background:var(--muted);color:var(--dim);font-weight:500;font-size:13px;cursor:pointer;white-space:nowrap;transition:background-color .15s ease,color .15s ease}
.composer.compact .chip{background:var(--muted)}
.chip svg{width:16px;height:16px}
.chip:hover,.chip:focus-visible{background:var(--brand-soft);color:var(--text)}
.chip.on,.pick.open .chip{background:var(--brand-soft);color:var(--text)}
.hint{font-size:12px;color:var(--faint);margin-right:6px}
.composer-bar{flex-wrap:nowrap}
.composer-bar .grow{display:none}
.composer-bar .hint{flex:1 1 0;min-width:0;text-align:right;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
@media (max-width:560px){.composer-bar{flex-wrap:wrap}}
.composer-opts{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows .32s ease,opacity .25s ease}
.composer-opts.open{grid-template-rows:1fr;opacity:1}
.composer-opts>.og{min-height:0;overflow:hidden;padding:0 12px;transition:padding .32s ease}
.composer-opts.open>.og{padding-bottom:12px}
/* attachments: link preview and files */
.att{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease}
.att.has{grid-template-rows:1fr}
.att>div{min-height:0;overflow:hidden}
.att-in{display:flex;flex-direction:column;gap:8px;padding:0 12px 8px}
.lp{display:flex;align-items:center;gap:12px;padding:8px;border-radius:12px;background:var(--muted);animation:rise .28s ease both}
.composer.compact .lp{background:var(--muted)}
.lp .th{position:relative;flex:none;width:112px;aspect-ratio:16/9;border-radius:8px;overflow:hidden;background:#2A1A12}
.lp .th img{width:100%;height:100%;object-fit:cover;display:block}
.lp .th .du{position:absolute;right:5px;bottom:5px;background:rgba(20,12,8,.82);color:#fff;font-size:11px;font-weight:600;padding:1px 6px;border-radius:6px}
.lp .tx{min-width:0;flex:1}
.lp .tx b{display:block;font-size:14px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lp .tx span{display:block;font-size:12px;color:var(--faint);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lp .ok{flex:none;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:#1F7A4D;background:#E3F4EA;padding:4px 10px;border-radius:999px}
.lp .ok svg{width:14px;height:14px}
.lp .ok.live{background:#C81E28;color:#fff}
.lp .ok.live i{width:6px;height:6px;border-radius:50%;background:#fff;animation:pulse 1.3s infinite}
.lp.bad{background:#FDECEC;color:#A12A2A;font-size:13px;padding:10px 12px}
.lp.bad>span{flex:1;min-width:0}
.lp.bad b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#7A1F1F}
.lp.wait .rm{margin-left:auto}
.lp.bad svg{width:16px;height:16px;flex:none}
.lp.wait .th,.sk{background:linear-gradient(90deg,#1E1E1E 0%,#2E2E33 50%,#1E1E1E 100%);background-size:200% 100%;animation:shimmer 1.2s linear infinite}
.sk{display:block;height:10px;border-radius:6px;margin:4px 0}
.lp{position:relative;overflow:hidden}
.lp .th video{width:100%;height:100%;object-fit:cover;display:block}
.lp .tx em{font-style:normal;color:#F8A9A9}
.lp .ok.up{background:var(--brand-soft);color:var(--text);min-width:52px;justify-content:center}
.lp .rm{flex:none;width:30px;height:30px;border-radius:8px;border:0;background:transparent;color:var(--faint);display:grid;place-items:center;cursor:pointer;transition:background-color .15s ease,color .15s ease}
.lp .rm:hover,.lp .rm:focus-visible{background:#FDECEC;color:#C53030}
.lp .rm svg{width:14px;height:14px}
.lp .pbar{position:absolute;left:0;bottom:0;height:3px;background:var(--brand);transition:width .2s ease}
.addrow{display:flex;align-items:center;gap:8px;width:100%;height:42px;padding:0 12px;border:0;border-radius:12px;background:transparent;color:var(--dim);font-size:13px;font-weight:600;cursor:pointer;transition:background-color .15s ease,color .15s ease;animation:rise .28s ease both}
.addrow:hover,.addrow:focus-visible{background:var(--brand-soft);color:var(--text)}
.addrow svg{width:16px;height:16px}
.addrow span{margin-left:auto;font-weight:500;color:var(--faint);font-size:12px}
@media (max-width:560px){.lp .th{width:88px}.lp .ok{display:none}}
.btn.primary:disabled{background:#F3E7DD;color:#B9A597;cursor:not-allowed}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}
@keyframes spin{to{transform:rotate(360deg)}}
.working{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--brand);background:rgba(255,139,51,.14);padding:2px 8px 2px 6px;border-radius:999px}
.working i{width:10px;height:10px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .8s linear infinite}
.nav-item.on .working{background:rgba(42,26,18,.14);color:var(--brand-ink)}
.app.mini .nav-item .working{display:none}

/* custom dropdown: a dark panel, no border or shadow needed against the white */
.pick{position:relative}
.pick .car{width:13px;height:13px;transition:transform .15s ease}
.pick.open .car{transform:rotate(180deg)}
.pick-menu{position:absolute;top:calc(100% + 6px);left:0;z-index:30;min-width:230px;max-height:280px;overflow:auto;background:#2A1A12;border-radius:12px;padding:6px;
  opacity:0;visibility:hidden;transform:translateY(-6px);pointer-events:none;transition:opacity .18s ease,transform .18s ease,visibility .18s}
.pick.open .pick-menu{opacity:1;visibility:visible;transform:none;pointer-events:auto}
.pick-opt{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border:0;background:transparent;color:#E9DED6;border-radius:8px;font-size:13px;font-weight:500;text-align:left;cursor:pointer;transition:background-color .15s ease,color .15s ease}
.pick-opt:hover,.pick-opt:focus-visible{background:rgba(255,255,255,.08);color:#fff}
.pick-new{display:flex;align-items:center;gap:10px;width:100%;margin-top:4px;padding:8px 10px;border:0;border-top:1px solid rgba(255,255,255,.08);border-radius:0 0 8px 8px;background:transparent;color:#FFB27A;font-size:13px;font-weight:600;text-align:left;cursor:pointer;transition:background-color .15s ease,color .15s ease}
.pick-new:hover,.pick-new:focus-visible{background:rgba(255,139,51,.14);color:#FFC79D}
.pick-new .av{background:rgba(255,139,51,.18)}
.pick-empty{margin:6px 10px 4px;font-size:12px;line-height:1.45;color:#B9A597}
img.av{object-fit:cover}
.pick-opt .av,.pick-new .av{flex:none;width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-size:11px;font-weight:700;background:rgba(255,139,51,.18);color:#FFB27A}
.pick-new .av svg,.pick-opt .av svg{width:14px;height:14px}
.pick-opt .tick{margin-left:auto;width:15px;height:15px;color:var(--brand);visibility:hidden}
.pick-opt[aria-selected=true] .tick{visibility:visible}
.pick-opt[aria-selected=true]{color:#fff}

/* options panel */
.og{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.ob{background:var(--muted);border-radius:12px;padding:12px 14px 14px;min-width:0}
.composer.compact .ob{background:var(--muted)}
.ob.wide{grid-column:1/-1}
.ot{font-size:12px;font-weight:600;color:var(--dim);margin-bottom:10px}
.ot.cap-head{display:flex;align-items:center;justify-content:space-between;gap:4px 8px;flex-wrap:wrap}
.cap-head label{display:inline-flex;align-items:center;gap:6px;cursor:pointer;color:var(--text)}
.cap-head input{accent-color:var(--brand);margin:0}
.nsteps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.nstep{display:flex;flex-direction:column;gap:6px;background:var(--bg);border-radius:10px;padding:10px 10px 8px}
.composer.compact .nstep{background:var(--muted)}
.nstep>span{font-size:12px;color:var(--faint)}
.nstep .ctl{display:flex;align-items:center;gap:6px}
.nstep .ctl button{flex:none;width:28px;height:28px;border-radius:8px;border:0;background:var(--muted);color:var(--text);display:grid;place-items:center;cursor:pointer;transition:background-color .15s ease,color .15s ease}
.composer.compact .nstep .ctl button{background:var(--muted)}
.nstep .ctl button:hover,.nstep .ctl button:focus-visible{background:var(--brand);color:var(--brand-ink)}
.nstep .ctl button svg{width:14px;height:14px}
.nstep input,.nstep input:focus{flex:1;min-width:0;height:30px;padding:0;border:0;background:transparent;text-align:center;font-size:20px;font-weight:700;color:var(--text);-moz-appearance:textfield}
.nstep input::-webkit-inner-spin-button,.nstep input::-webkit-outer-spin-button,.range input::-webkit-inner-spin-button,.range input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.nstep .ctl i{font-style:normal;font-size:12px;color:var(--faint);width:10px}
.tiles3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile-o{display:flex;flex-direction:column;gap:7px;padding:6px 6px 8px;border:0;border-radius:10px;background:transparent;color:var(--dim);font-size:12px;font-weight:600;cursor:pointer;text-align:center;transition:background-color .15s ease,color .15s ease}
.composer.compact .tile-o{background:var(--muted)}
.tile-o:enabled:hover,.tile-o:focus-visible{background:var(--brand-soft);color:var(--text)}
.tile-o[aria-pressed=true]{background:var(--brand-soft);color:var(--text)}
.cap-prev{height:54px;border-radius:7px;background:#1E1612;display:flex;align-items:center;justify-content:center;white-space:nowrap;overflow:hidden;font-size:14px;line-height:1;color:#fff;letter-spacing:0;-webkit-text-stroke:1px #000;paint-order:stroke fill}
.cap-prev b{font-weight:inherit}
.lay-prev{height:54px;border-radius:7px;background:#1E1612;display:grid;place-items:center}
.lay-prev .ph{position:relative;width:28px;height:48px;border-radius:4px;overflow:hidden;background:#4A3428}
.lay-prev .ph::before{content:"";position:absolute;inset:0;background:linear-gradient(160deg,#B4643A,#5E3A2A);filter:blur(3px);opacity:.75}
.lay-prev .ph i{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);height:16px;background:linear-gradient(135deg,#FF8B33,#FFB27A)}
.lay-prev.zoom .ph i{left:-6px;right:-6px;height:24px}
.lay-prev.crop .ph i{left:0;right:0;top:0;height:100%;transform:none}
.seg{display:flex;gap:4px;background:var(--bg);border-radius:10px;padding:4px}
.composer.compact .seg{background:var(--muted)}
.seg button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 6px;border:0;border-radius:7px;background:transparent;color:var(--dim);font-size:13px;font-weight:600;cursor:pointer;transition:background-color .15s ease,color .15s ease}
.seg button small{font-size:11px;font-weight:500;color:var(--faint);transition:color .15s ease}
.seg button:hover,.seg button:focus-visible{background:var(--brand-soft);color:var(--text)}
.seg button[aria-pressed=true]{background:var(--brand-soft);color:var(--text)}
.seg button[aria-pressed=true] small{color:var(--brand-deep)}
.range{display:flex;align-items:center;gap:8px}
.range label{flex:1;display:flex;align-items:center;gap:6px;background:var(--bg);border-radius:10px;padding:0 10px;height:44px;font-size:12px;color:var(--faint);min-width:0}
.composer.compact .range label{background:var(--muted)}
.range input,.range input:focus{flex:1;min-width:0;height:40px;border:0;background:transparent;padding:0;font-size:15px;font-weight:600;color:var(--text);-moz-appearance:textfield}
.range>svg{width:14px;height:14px;color:var(--faint);flex:none}
@media (max-width:640px){.og{grid-template-columns:1fr}.nsteps{grid-template-columns:1fr}}

/* ---------- home blocks */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:16px}
.tile{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column}
.tile i{width:32px;height:32px;border-radius:var(--r-sm);background:var(--brand-soft);color:var(--brand-deep);display:grid;place-items:center;margin-bottom:14px}
.tile i svg{width:18px;height:18px}
.tile b{font-size:26px;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums;color:var(--text);line-height:1.1}
.tile span{font-size:13px;color:var(--dim);margin-top:2px}
.home-grid{display:grid;grid-template-columns:minmax(0,1.9fr) minmax(300px,1fr);gap:16px;align-items:stretch}
.home-grid>.card:first-child{display:flex;flex-direction:column}
.home-grid>.card:first-child .chart{margin-top:auto}
.steps.across{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.home-grid>.card{margin-bottom:0}
.home-grid+.card,.home-grid+.card+.card{margin-top:16px}
.home-grid .ai-home{margin-bottom:0}
.kpis{display:flex;gap:24px;flex-wrap:wrap}
.kpi b{display:block;font-size:20px;font-weight:600;letter-spacing:-.02em;color:var(--text);font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--dim)}
.legend{display:flex;gap:16px;font-size:12px;color:var(--dim);margin:2px 0 12px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:6px;vertical-align:-1px}
.chart{width:100%;height:auto;display:block}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart text{font:11px "Geist","Segoe UI",sans-serif;fill:var(--faint)}
.chart .b1{fill:var(--brand)}.chart .b2{fill:var(--brand-deep)}
.chart .none{font-size:13px;fill:var(--dim)}
.steps{display:flex;flex-direction:column;gap:8px}
.step{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:12px;border-radius:var(--r);background:var(--muted);border:0;cursor:pointer}
.step:active{background:var(--line)}
.set-layout{display:grid;grid-template-columns:240px minmax(0,1fr);gap:32px;align-items:start}
.set-nav{position:sticky;top:76px;display:flex;flex-direction:column;gap:2px}
.set-link{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border-radius:10px;color:var(--dim);text-decoration:none;transition:background-color .15s ease,color .15s ease}
.set-link svg{flex:none;width:18px;height:18px;margin-top:2px}
.set-link b{display:block;font-size:14px;font-weight:600;color:var(--text)}
.set-link small{display:block;font-size:12px;color:var(--faint);line-height:1.4}
.set-link:hover{background:var(--muted)}
.set-link.on{background:var(--brand-soft)}.set-link.on svg{color:var(--brand-deep)}.set-link.on b{color:var(--text)}
.set-body{min-width:0;animation:rise .25s ease both}
.ai-form{display:grid;gap:18px;max-width:560px}
.ai-form select{width:100%}
.ai-form .with{display:flex;gap:8px}.ai-form .with input{flex:1;min-width:0}
.ai-form .hint{font-size:12px;font-weight:400;color:var(--dim)}
.ai-form .hint a{color:var(--brand-deep);font-weight:600}
.ai-form .hint a:hover{color:var(--text)}
.ai-state{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.brand-preview{display:flex;gap:18px;align-items:flex-start;margin:0 0 18px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--card,rgba(255,255,255,.03))}
.fontpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;margin:10px 0 4px}
.fpick{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:10px 12px;border:1px solid var(--line);
  border-radius:10px;background:var(--card);color:var(--text);cursor:pointer;text-align:left;transition:border-color .2s,background .2s}
.fpick:hover{border-color:var(--brand-line);background:var(--brand-soft)}
.fpick.on{border-color:var(--brand);background:var(--brand-soft)}
.fpick-s{font-size:22px;line-height:1.2;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.fpick-n{font-size:11px;color:var(--faint)}
.brand-preview img{width:172px;height:auto;border-radius:10px;border:1px solid var(--line);display:block;background:#141821;flex:none}
.brand-preview .sub{max-width:420px}
@media (max-width:560px){.brand-preview{flex-direction:column}.brand-preview img{width:100%;max-width:260px}}
.set-sec{padding:0 0 26px;margin-bottom:26px;border-bottom:1px solid var(--line)}
.set-sec:last-child{border-bottom:0}
.set-sec h2{font-size:17px;color:var(--text);margin-bottom:4px}
.set-sec .help{margin-bottom:16px}
.set-load{padding:40px 0;color:var(--faint)}
.fields.narrow{max-width:420px;grid-template-columns:1fr}
/* ---------- caption looks: a real frame for each style, so a look is picked as a picture instead of a word */
.stiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px;max-height:420px;overflow:auto;padding:4px}
.stile{padding:4px;border:1px solid var(--line);border-radius:10px;background:transparent;cursor:pointer;display:grid;gap:4px;font-family:inherit}
.stile img{width:100%;aspect-ratio:9/16;object-fit:cover;border-radius:6px;display:block;background:#141821}
.stile.on{border-color:var(--accent,#4f8cff);box-shadow:none}
.stile span{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stile:hover{border-color:var(--line-2)}
.stile.on{border-color:var(--brand)}   /* this app's accent is the brand orange, so the border follows it */
.stiles .stile span{color:var(--dim)}  /* --muted is a background tint here, so the little names use the dim text colour */
.stile-box{display:grid;gap:7px;font-size:12px;color:var(--dim);font-weight:600}
.prof{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.prof-pic{width:56px;height:56px;font-size:22px;border-radius:50%;object-fit:cover;color:#fff}
.prof b{display:block;font-size:16px;color:var(--text)}.prof span{font-size:13px;color:var(--dim)}
.kv{margin:0 0 12px;border-top:1px solid var(--line)}
.kv div{display:grid;grid-template-columns:180px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.kv dt{font-size:13px;color:var(--dim)}.kv dd{margin:0;font-size:14px;color:var(--text);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.apps{display:flex;flex-direction:column;gap:10px}
.appcard{display:flex;gap:14px;align-items:flex-start;padding:14px 16px;border:1px solid var(--line);border-radius:12px}
.applogo{flex:none;width:40px;height:40px;border-radius:10px;display:grid;place-items:center}
.applogo svg{width:22px;height:22px}
.apptx{flex:1;min-width:0}.apptx>b{display:block;font-size:15px;color:var(--text)}.apptx>span{font-size:13px;color:var(--dim)}
.appact{flex:none}
.appcard{flex-wrap:wrap}
.stor-path{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stor-path code{flex:1 1 260px;min-width:0;overflow-wrap:anywhere;font-size:13px;background:var(--muted);border-radius:8px;padding:10px 12px}
.stor-bar{height:10px;border-radius:999px;background:var(--muted);overflow:hidden;margin:14px 0 6px}
.stor-bar i{display:block;height:100%;background:var(--brand);border-radius:999px}
.stor-bar.low i{background:var(--bad)}
.stor-nums{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--dim)}
.stor-change{margin-top:16px;padding:14px 16px;border-radius:10px;background:var(--muted);display:grid;gap:12px}
.stor-change .with{display:flex;gap:8px}.stor-change .with input{flex:1;min-width:0}
.appsetup{flex-basis:100%;margin-top:4px;padding:14px 16px;border-radius:10px;background:var(--muted);display:grid;gap:12px}
.appsetup ol{margin:0;padding-left:18px;font-size:13px;color:var(--text);display:grid;gap:4px}
.appsetup a{color:var(--brand-deep);font-weight:600}
.appsetup a:hover{color:var(--text)}
.appsetup .copyrow{display:flex;gap:8px;align-items:center}
.appsetup .copyrow code{flex:1;min-width:0;overflow-wrap:anywhere;font-size:12px;background:var(--bg);border:1px solid var(--line-2);border-radius:8px;padding:8px 10px}
.warnline{font-size:12px;color:var(--brand-deep)}
.appact{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.applist{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.applist div{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.applist .btn{margin-left:auto}
@media (max-width:860px){.set-layout{grid-template-columns:1fr;gap:16px}.set-nav{position:static;flex-direction:row;overflow-x:auto}.set-link small{display:none}.set-link{flex:none}.kv div{grid-template-columns:1fr;gap:2px}}
.cform-note{display:flex;gap:10px;align-items:flex-start;margin:0 0 16px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--brand-soft);color:var(--text)}
.cform-note svg{width:16px;height:16px;flex:none;margin-top:2px;color:var(--brand)}
.card h2 .cn{display:inline-grid;place-items:center;width:22px;height:22px;margin-right:10px;border-radius:50%;background:var(--brand-soft);color:var(--brand-deep);font-size:12px;font-weight:700;vertical-align:2px}
.fh{display:block;font-size:12px;font-weight:400;line-height:1.45;color:var(--dim)}
.more-opts{margin-top:18px;border-top:1px solid var(--line);padding-top:12px}
.more-opts>summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--dim);transition:color .15s ease;width:max-content}
.more-opts>summary:hover{color:var(--text)}
.more-opts[open]>summary{margin-bottom:16px}
.how{margin-bottom:16px}.how .step{background:var(--muted);transition:background-color .15s ease}.how .step:hover,.how .step:focus-visible{background:var(--brand-soft)}
button.tile{font:inherit;text-align:left;cursor:pointer;color:inherit;transition:background-color .15s ease,border-color .15s ease}
button.tile:hover,button.tile:focus-visible{background:var(--brand-soft);border-color:var(--brand-line)}
.tile em{font-style:normal;font-size:12px;color:var(--faint);margin-top:6px}
.savebar{position:sticky;bottom:16px;z-index:4;display:flex;align-items:center;gap:10px;padding:10px 10px 10px 16px;margin-top:8px;border-radius:14px;background:var(--brand-ink);color:#F4ECE6;opacity:0;transform:translateY(12px);pointer-events:none;transition:opacity .2s ease,transform .2s ease}
.savebar.on{opacity:1;transform:none;pointer-events:auto}
.savebar>span{flex:1;display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500}
.savebar>span svg{width:16px;height:16px;color:var(--brand)}
.savebar .btn.ghost{color:#E9DED6;background:transparent;border-color:transparent}
.savebar .btn.ghost:hover{background:rgba(255,255,255,.08)}
.step .n{width:26px;height:26px;border-radius:999px;border:1px solid var(--line-2);background:var(--bg);display:grid;place-items:center;font-size:12px;font-weight:600;flex:none;color:var(--text)}
.step b{display:block;font-weight:600;color:var(--text)}
.step .d{font-size:12px;color:var(--dim)}
.step>svg{color:var(--faint);margin-left:auto}
.allset{display:flex;gap:12px;align-items:center;padding:14px;border-radius:var(--r);background:var(--good-soft);color:var(--good);font-weight:600}

/* ---------- jobs + clips */
.job{margin-bottom:36px}
.job-head{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;margin-bottom:14px}
.jt{display:flex;gap:14px;align-items:center;min-width:0}
.jthumb{position:relative;flex:none;width:128px;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:var(--muted);display:grid;place-items:center;color:var(--faint)}
.jthumb img{width:100%;height:100%;object-fit:cover;display:block}
.jthumb>svg{width:22px;height:22px}
.jthumb .du{position:absolute;right:5px;bottom:5px;background:rgba(20,12,8,.82);color:#fff;font-size:11px;font-weight:600;padding:1px 6px;border-radius:6px}
@media (max-width:560px){.jthumb{width:92px}}
.job-head h3{font-size:15px;font-weight:600;overflow-wrap:anywhere;color:var(--text);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bar{height:6px;background:var(--muted);border-radius:999px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--brand);border-radius:999px;transition:width .8s ease}
.err{color:var(--bad);font-size:13px;overflow-wrap:anywhere;margin:6px 0}
.peekbox{margin:8px 0 4px;min-height:0;display:grid;gap:6px}
.peekbox:empty{display:none}
.peekbox img{width:100%;border-radius:10px;border:1px solid var(--line);display:block}
.toolsbox:empty{display:none}
.toolsbox{margin-top:12px}
.toolsrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line)}
.toolsrow:first-child{border-top:0}
.toolsrow span{display:flex;flex-direction:column;gap:2px;font-size:14px}
.toolsrow small{color:var(--dim);font-size:12px}
.toolpre{margin:0;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--muted);overflow-x:auto;font-size:12px;line-height:1.5}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.clip{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.shot{position:relative;aspect-ratio:9/16;background:#17110E;border:0;padding:0;cursor:pointer;display:block;width:100%;overflow:hidden}
.shot img{width:100%;height:100%;object-fit:cover;display:block}
.shot .veil{position:absolute;left:10px;bottom:10px}
.veil span{width:34px;height:34px;border-radius:50%;background:var(--brand);display:grid;place-items:center;color:var(--brand-ink)}
.veil svg{width:15px;height:15px;margin-left:2px}
.badge{position:absolute;top:10px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:var(--r-sm);background:var(--brand);color:var(--brand-ink)}
.badge.l{left:10px}.badge.r{right:10px}
.badge.s-hi{background:var(--brand);color:var(--brand-ink)}.badge.s-mid{background:var(--brand-soft);color:var(--brand)}
.making{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:14px;color:var(--text);font-size:13px;font-weight:500;background:linear-gradient(110deg,rgba(10,10,10,.86) 30%,rgba(24,24,24,.78) 50%,rgba(10,10,10,.86) 70%);background-size:220% 100%;animation:shim 1.6s linear infinite}
@keyframes shim{to{background-position:-220% 0}}
.clip-body{padding:12px 14px;display:flex;flex-direction:column;gap:5px;flex:1}
.hook{font-weight:600;font-size:13px;color:var(--text)}
.ttl{color:var(--dim);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.selck{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:8px;cursor:pointer;flex:none;transition:background-color .15s ease}
.selck:hover{background:var(--brand-soft)}
.selck input{width:16px;height:16px;accent-color:var(--brand);cursor:pointer;margin:0}
.clip.picked{border-color:var(--brand)}
#selbar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:60;display:none;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;
  max-width:calc(100vw - 24px);padding:10px 12px 10px 18px;border-radius:14px;background:#1F140D;color:#FFF4EA;font-size:14px;border:1px solid rgba(255,178,122,.25)}
#selbar.on{display:flex}
#selbar b{font-weight:700;margin-right:6px}
#selbar .btn{background:transparent;color:#FFF4EA;border-color:rgba(255,244,234,.25)}
#selbar .btn:hover{background:rgba(255,244,234,.1)}
#selbar .btn.primary{background:var(--brand);color:#1F140D;border-color:var(--brand)}
#selbar .btn.primary:hover{background:#FFA25C}
#selbar .btn.danger{color:#FF9A8F;border-color:rgba(255,154,143,.45)}
#selbar .btn.danger:hover{background:rgba(255,154,143,.14)}
.danger-card{border-color:#F3C9C4}
.danger-card h2{color:var(--bad)}
.clip-foot{display:flex;gap:4px;align-items:center;margin-top:auto;padding-top:8px}
/* Clip card: one padding, a two-line hook, one clamped reason, then three equal actions */
.clip-body{padding:14px;gap:6px}
.clip .hook{font-size:14px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.clip .why{font-size:12px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clip .ttl{-webkit-line-clamp:1}
/* Three equal columns could not hold "Download" in a narrow card, so its icon ran into the buttons either side.
   The buttons now take the room their words need and wrap to a second row when a card is too narrow for all three.
   (#main and !important: the shared look in feat/skin.js sets a wider padding on every small button.) */
.clip-acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:8px}
#main .clip-acts .btn{flex:1 1 auto;height:32px;padding:0 8px !important;justify-content:center;min-width:0;font-size:12px !important;gap:5px;white-space:nowrap}
.clip-acts .btn svg{flex:none}
.clip-acts .btn.pq{background:var(--brand-soft);color:var(--brand);border-color:var(--brand-soft)}
.clip-acts .btn.pq:hover{background:var(--brand);color:var(--brand-ink)}
.clip-acts+.clip-foot{margin-top:0;padding-top:2px}
.clip-acts .lbl{display:none}
#main .clip-acts a.btn{flex:0 0 38px;padding:0 !important}
.job-prog{margin:4px 0 16px;padding:14px 16px;border:1px solid var(--line);border-radius:var(--r);background:var(--muted)}
.jp-stage{display:flex;justify-content:space-between;gap:10px;margin:0 0 10px;font-size:14px;color:var(--text)}
.jp-stage span{color:var(--brand);font-weight:700}
.job-prog .bar{height:8px}
.job-prog .sub{margin:8px 0 0}
/* Home: the link box is the centre of the page; recent work next; counters quieter below */
.hero{padding-top:72px;padding-bottom:64px}
.composer.big .composer-input input,.composer.big .composer-input input:focus{height:52px;font-size:16px}
.composer.big .composer-bar{padding:4px 10px 10px 12px}
.composer.big .composer-bar .btn.primary{height:52px;padding:0 26px;font-size:16px;border-radius:var(--r)}
.ov-line{text-align:center;margin:-36px auto 32px;max-width:760px;font-size:13px}
#ov{max-width:1100px;margin:0 auto}
.ov-recent .rp-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.rp{display:flex;gap:12px;align-items:center;text-align:left;padding:10px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg);color:var(--text);cursor:pointer;min-width:0;transition:background-color .15s ease,border-color .15s ease}
.rp:hover,.rp:focus-visible{background:var(--brand-soft);border-color:var(--brand-soft)}
.rp-pic{flex:none;width:72px;aspect-ratio:16/9;border-radius:var(--r-sm);overflow:hidden;background:var(--muted);display:grid;place-items:center;color:var(--faint)}
.rp-pic img{width:100%;height:100%;object-fit:cover;display:block}
.rp-tx{min-width:0;display:flex;flex-direction:column;gap:5px;align-items:flex-start;flex:1}
.rp-tx b{font-size:13px;font-weight:600;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rp-tx .bar{width:100%;height:4px}
.tiles.ov-quiet{margin-top:8px;gap:12px}
.ov-quiet .tile{padding:12px 14px}
.ov-quiet .tile b{font-size:20px}
.ov-quiet .tile em{display:none}
@media (max-width:700px){.hero{padding-top:40px;padding-bottom:48px}.ov-line{margin:-28px auto 24px}.ov-recent .rp-list{grid-template-columns:1fr}.tiles.ov-quiet{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* ---------- live */
.livecard{background:var(--bg);border:1px solid #4A2226;border-radius:var(--r);padding:20px;margin-bottom:28px}
.lc-head{display:flex;gap:16px;align-items:flex-start;justify-content:space-between}
.lc-title{flex:1;min-width:0}
.lc-title h3{margin-top:8px;font-size:16px;line-height:1.4;color:var(--text);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.lc-acts{flex:none;display:flex;gap:8px;align-items:center}
.lc-acts .btn{height:40px}
@media (max-width:900px){.lc-head{flex-direction:column}.lc-acts{width:100%}.lc-acts .btn{flex:1;justify-content:center}}
.stats{display:flex;gap:28px;flex-wrap:wrap;margin:18px 0}
.stat b{display:block;font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--text)}
.evbtn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 8px 0 0;border:0;background:transparent;font:inherit;font-size:20px;font-weight:600;color:var(--text);cursor:pointer;border-radius:8px;transition:color .15s ease}
.evbtn:hover,.evpick.open .evbtn{color:var(--brand)}
.evbtn .car{width:14px;height:14px;color:var(--faint)}
.evpick .pick-menu{min-width:240px}
.pick-opt .ph{font-size:11px;color:#9C8A7E;margin-left:6px}
.stat .evpick .pick-opt .pl{font-size:13px;color:inherit}.stat .evpick .pick-opt .ph{font-size:11px;color:#9C8A7E}.stat .evpick .evbtn .pv{font-size:20px;color:inherit}
.autonote{font-size:12px;color:var(--faint);margin:-8px 0 14px}.stat span{font-size:12px;color:var(--dim)}
.meters{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.meter{background:var(--muted);border-radius:var(--r);padding:12px 14px}
.meter h4{font-size:12px;color:var(--dim);font-weight:600;margin-bottom:9px}
.spark{display:flex;align-items:flex-end;gap:1px;height:46px}
.spark i{flex:1;background:var(--brand);min-height:2px;border-radius:1px}.spark.chat i{background:var(--good)}
.said{font-size:13px;color:var(--faint);height:76px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
.said div:last-child{color:var(--text)}

/* ---------- tables + logs */
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;font-weight:500;color:var(--faint);padding:0 10px 10px;white-space:nowrap}
td{padding:12px 10px;border-top:1px solid var(--line);vertical-align:middle;overflow-wrap:anywhere}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
a.lnk{color:var(--text);text-decoration:none;font-weight:600}
.log{display:flex;flex-direction:column}
.log div{display:flex;gap:14px;padding:11px 0;font-size:13px}
.log div+div{border-top:1px solid var(--line)}
.log time{color:var(--faint);white-space:nowrap;flex:none;width:118px}

/* ---------- plans */
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.plan{position:relative;display:flex;flex-direction:column;gap:4px;padding:18px;border-radius:var(--r);background:var(--bg);border:1px solid var(--line-2);cursor:pointer;font-size:13px;color:var(--dim)}
.plan b{font-size:16px;font-weight:600;color:var(--text);margin-bottom:6px;display:flex;align-items:center;gap:8px}
.plan b svg{color:var(--brand)}
.plan em{position:absolute;top:16px;right:16px;font-style:normal;font-size:11px;font-weight:600;background:var(--brand-ink);color:var(--brand);padding:2px 8px;border-radius:999px}
.plan input{position:absolute;opacity:0;pointer-events:none}
.plan.on{background:var(--brand-soft);border-color:var(--brand)}
.plan:has(input:focus-visible){outline:2px solid var(--brand);outline-offset:2px}

/* ---------- dialogs + toasts */
dialog{border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:var(--r-lg);padding:0;max-width:calc(100vw - 32px)}
/* The backdrop has to be dark enough to read as "the page behind is out of play". On a white page 42% of near-black
   did that; on a black page it is almost invisible, so the page beside a wide dialog looked like part of it. */
dialog::backdrop{background:rgba(0,0,0,.72);animation:fadein .16s ease}
.dlg{padding:24px;width:450px;max-width:100%;display:flex;flex-direction:column;gap:14px}
.dlg h2{font-size:18px;font-weight:600;color:var(--text)}
.dlg-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}
/* The clip editor: transcript on the left, the video in the middle, the controls in a rail on the right.
   Three columns need room, so the dialog is wide on a desktop and folds to one column on a phone. */
dialog.wide{width:min(1560px,calc(100vw - 32px));max-width:min(1560px,calc(100vw - 32px))}
.editor{display:grid;grid-template-columns:minmax(300px,1fr) minmax(380px,500px);height:calc(100vh - 48px);max-height:calc(100vh - 48px);overflow:hidden}
.editor .stage{background:#17110E;display:grid;place-items:center;position:relative;min-height:0;overflow:hidden}
.editor .stage video,.editor .stage img{position:absolute;inset:0;width:100%;height:100%;aspect-ratio:auto;object-fit:contain;display:block}
.editor .stage video{background:#000}
.editor .panel{padding:0;overflow:hidden;display:flex;flex-direction:column;gap:0;border-left:1px solid var(--line);background:var(--bg);min-height:0}
.editor .panel .job-head{margin:0;padding:16px 18px 10px;flex:none}
.ed-panes{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:14px;padding:16px 18px 20px}
.ed-pane{display:flex;flex-direction:column;gap:12px}
.ed-pane[hidden]{display:none}
.ed-pane + .ed-pane{padding-top:14px;border-top:1px solid var(--line)}
.ed-pane h3:first-child{margin-top:0}
.ed-intro{font-size:14px;color:var(--text);line-height:1.5}
.editor h3{font-size:13px;font-weight:600;color:var(--dim);margin-top:4px;display:flex;align-items:center;justify-content:space-between;gap:6px}
.editor .hint{margin:-6px 0 0;font-size:12px;line-height:1.5}
.editor label.f{gap:6px}
.ed-foot{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:12px 18px;border-top:1px solid var(--line);background:var(--bg);position:sticky;bottom:0;z-index:3}
.ed-foot .btn{margin:0}
.ed-dirty{flex:1 1 100%;order:5;font-size:12px;color:var(--brand-deep)}
.ed-close{margin-left:auto}
.ed-words{display:flex;flex-wrap:wrap;gap:5px;align-content:flex-start;max-height:240px;overflow:auto;padding:8px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--muted)}
.ed-w{border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:7px;padding:4px 8px;font:inherit;font-size:12px;line-height:1.3;cursor:pointer;display:inline-flex;flex-direction:column;align-items:flex-start;gap:2px;max-width:100%}
.ed-w:hover{border-color:var(--brand);color:var(--brand-deep)}
@media (max-width:640px){.ed-w{min-height:44px;padding:8px 10px}}
.ed-w.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.ed-w .t{font-size:10px;color:var(--faint);font-variant-numeric:tabular-nums}

  const tile = x => `<button type="button" class="stile${x.v === on ? " on" : ""}" data-style="${esc(x.v)}"${x.house ? ' data-house="1"' : ""}${off ? " disabled" : ""} aria-pressed="${x.v === on}" title="${esc(x.label)}${x.house ? " - made for Clipstorm" : ""}">

function watchStyleTiles() {
  const imgs = $$(".stile img[loading=lazy]").filter(i => i.dataset.watched !== "1" && !i.complete);

  if (r.dataset.rm === "link") A.links = A.links.filter(l => l.id !== r.dataset.id);
  else { const i = A.files.findIndex(f => f.id === r.dataset.id); if (i >= 0) { URL.revokeObjectURL(A.files[i].src); A.files.splice(i, 1); } }
  if (!A.links.some(l => l.state === "wait")) A.queued = false;
  drawAtt();
});

// A big file goes in pieces (anything standing in front of the app refuses one huge request), two at a time,
// and a piece that fails is simply sent again. The bar shows the whole file.
async function sendBig(f, who, options) {
  const file = f.file;
  const s = await send("/api/upload/start", {name: file.name, size: file.size, options, creator: who});
  const sent = new Array(s.parts).fill(0);
  const show = () => { f.pct = Math.min(99, Math.round(sent.reduce((a, b) => a + b, 0) / file.size * 100)); drawAtt(); };
  const put = i => new Promise((ok, fail) => {
    const x = new XMLHttpRequest();
    x.open("PUT", `/api/upload/${s.id}/${i}`);
    x.setRequestHeader("Content-Type", "application/octet-stream");
    x.upload.onprogress = e => { sent[i] = e.loaded; show(); };
    x.onload = () => {
      if (x.status === 401) { location.href = "/login"; return; }
      if (x.status >= 200 && x.status < 300) { sent[i] = Math.min(s.part, file.size - i * s.part); show(); return ok(); }
      let d = "Upload failed"; try { d = JSON.parse(x.responseText).detail || d; } catch {}
      const err = new Error(typeof d === "string" ? d : "Upload failed"); err.final = x.status >= 400 && x.status < 500 && x.status !== 408 && x.status !== 429; fail(err);
    };
    x.onerror = x.ontimeout = () => fail(new Error("Upload failed. Check your connection."));
    x.send(file.slice(i * s.part, Math.min(file.size, (i + 1) * s.part)));
  });
  let next = 0;
  const worker = async () => {
    while (next < s.parts) {
      const i = next++;
      for (let tries = 0; ; tries++) {
        try { await put(i); break; }
        catch (e) { sent[i] = 0; if (e.final || tries >= 3) throw e; await new Promise(r => setTimeout(r, 1500 * (tries + 1))); }
      }
    }
  };
  try {
    await Promise.all([worker(), worker()]);
    await send(`/api/upload/${s.id}/finish`, {});
    f.pct = 100; drawAtt();
  } catch (e) {
    next = s.parts;                                   // stop the other sender
    api(`/api/upload/${s.id}`, {method: "DELETE"}).catch(() => {});
    throw e;
  }
}
function sendFile(f, who, options) {
  if (S.status.upload_part_mb && f.file.size > S.status.upload_part_mb * 1048576) return sendBig(f, who, options);
  return new Promise((ok, fail) => {
    const x = new XMLHttpRequest(), fd = new FormData();
    fd.append("file", f.file); fd.append("options", JSON.stringify(options)); fd.append("creator", who);
    x.open("POST", "/api/upload");
    x.upload.onprogress = e => { if (e.lengthComputable) { f.pct = Math.round(e.loaded / e.total * 100); drawAtt(); } };
    x.onload = () => {
      if (x.status === 401) { location.href = "/login"; return; }
      if (x.status >= 200 && x.status < 300) return ok();
      let d = "Upload failed"; try { d = JSON.parse(x.responseText).detail || d; } catch {}
      fail(new Error(typeof d === "string" ? d : "Upload failed"));
    };
    x.onerror = () => fail(new Error("Upload failed. Check your connection."));
    x.send(fd);
  });
}
async function makeClips() {
  const A = att();
  if (A.busy) return;
  const typed = $("#url")?.value.trim();
  if (typed && looksLink(typed) && !isChannel(typed)) { clearTimeout(linkTimer); takeLink(A, typed, $("#url")); }
  if (A.links.some(l => l.state === "wait")) {   // still looking a link up: start as soon as it is found
    A.queued = true; drawAtt();
    toast("Finding the video first. Clipping starts as soon as it's found.");
    return;
  }
  if (!canGo(A)) {
    toast(A.note || "Paste a YouTube, Twitch or Kick video link, or add a video file first.", "bad");
    $("#url")?.focus();
    return;
  }
  A.busy = true; drawAtt();
  let started = 0, failed = 0;
  const who = targetCreator(), opts = jobOptions();
  for (const l of A.links.filter(x => x.state === "ok")) {
    l.sending = true; drawAtt();
    try { await send("/api/jobs", {url: l.url, options: opts, creator: who}); l.state = "done"; started++; }
    catch (e) { l.state = "bad"; l.msg = e.message; failed++; }
    l.sending = false; drawAtt();
  }
  for (const f of A.files) {
    f.state = "up"; f.pct = 0; drawAtt();
    try { await sendFile(f, who, opts); f.state = "done"; started++; }
    catch (e) { f.state = "error"; f.err = e.message; failed++; }
    drawAtt();
  }
  A.links = A.links.filter(l => l.state !== "done");
  A.files = A.files.filter(f => { if (f.state === "done") { URL.revokeObjectURL(f.src); return false; } return true; });
  A.busy = false; drawAtt();
  if (started) {
    toast(`${started === 1 ? "Your video is" : started + " videos are"} being clipped now.`, "ok");
    if (!failed && S.view === "overview") go(who ? "c:" + who : "library"); else tick();
  } else if (failed) toast("Nothing was started. The reason is shown on the video.", "bad");
}

const EVERY = [[1, "1 min", ""], [2, "2 min", ""], [3, "3 min", ""], [5, "5 min", ""], [10, "10 min", ""]];

function jobHtml(j) {

  const who = !creatorId() && j.creator ? S.creators.find(c => c.id === j.creator)?.name : "";
  const done = j.clips.filter(c => c.status === "done"), nClips = j.clips.length;
  const host = (() => { try { return new URL(j.source?.url).hostname.replace(/^www\./, ""); } catch { return ""; } })();
  const from = j.source?.type === "file" ? "Uploaded file" : [j.uploader, host].filter(Boolean).join(" on ") || "A link";
  const meta = [who, "From: " + from, j.duration ? fmt(j.duration) + " long" : "", nClips ? nClips + (nClips === 1 ? " clip" : " clips") : "No clips yet",
                j.took ? "made in " + fmt(j.took) : ""].filter(Boolean).map(esc).join(" · ");
  const status = j.error ? `<span class="pill bad">Failed</span>`

  const pct = Math.round((j.progress || 0) * 100);

  const best = [...done].sort((x, y) => (y.score || 0) - (x.score || 0))[0];

  const pic = j.thumb ? `<img src="/media/${esc(j.id)}/thumb.jpg" alt="" loading="lazy">` : ic(j.source?.type === "file" ? "film" : "link");
  return `<div class="job-head"><div class="jt"><span class="jthumb">${pic}${j.duration ? `<span class="du">${fmt(j.duration)}</span>` : ""}</span><div style="min-width:0"><h3>${esc(j.title || j.source.name)}</h3><p class="sub">${status} ${meta}</p></div></div>
      <div class="row" style="flex-wrap:nowrap;gap:4px">${main}${busy ? "" : `
        ${j.clips.length ? `<button class="btn sm ghost" data-act="copyall" data-j="${j.id}" title="Copy the post text of every clip of this video">${ic("copy")}Copy all post text</button>` : ""}
        ${j.clips.some(c => c.status === "done") ? `<button class="btn sm icon ghost" data-act="dlall" data-j="${j.id}" title="Download all clips of this video" aria-label="Download all clips of this video">${ic("down")}</button>` : ""}
        <button class="btn sm icon ghost" data-act="deljob" data-j="${j.id}" title="Delete" aria-label="Delete this video and its clips">${ic("trash")}</button>
        <label class="selck" title="Select this video and its clips"><input type="checkbox" data-sel="j:${j.id}" ${sel().has("j:" + j.id) ? "checked" : ""} aria-label="Select this video"></label>`}</div></div>
    ${busy ? `<div class="job-prog"><p class="jp-stage"><b>${esc(j.stage || (j.status === "queued" ? "Waiting its turn" : "Working"))}</b><span>${pct}%</span></p><div class="bar"><i style="width:${pct}%"></i></div>${heard ? `<p class="sub">${esc(heard.replace(/^ · /, ""))}</p>` : ""}</div>` : ""}
    ${j.status === "done" && !j.clips.length ? `<p class="sub">${esc(j.stage)}</p>` : ""}
    ${j.error ? `<div class="err">${esc(j.error)}<button class="rep" data-act="report" data-ctx="${esc("Video failed: " + (j.title || j.source.name || "") + " | " + j.error)}">Report this</button></div>` : ""}${j.ai?.note ? `<p class="sub">${esc(j.ai.note)}</p>` : ""}
    ${j.clips.length ? `<div class="grid">${j.clips.map(c => clipHtml(j, c)).join("")}</div>` : ""}`;
}
/* ---- selecting several videos and clips: delete or download them together */
const sel = () => (S.sel = S.sel || new Set());
function selParts() {
  const jobsSel = [], clipsSel = [];
  for (const k of sel()) { const p = k.split(":"); if (p[0] === "j") jobsSel.push(p[1]); else clipsSel.push([p[1], p[2]]); }
  return {jobsSel, clipsSel};
}
function selClips() {          // every finished clip the selection covers, for downloading
  const {jobsSel, clipsSel} = selParts(), out = new Map();
  jobsSel.forEach(id => (jobOf(id)?.clips || []).forEach(c => { if (c.status === "done") out.set(id + "." + c.id, 1); }));
  clipsSel.forEach(([j, c]) => { if (jobOf(j)?.clips.find(x => x.id === c)?.status === "done") out.set(j + "." + c, 1); });
  return [...out.keys()];
}

function drawJobs() {

async function loadOverview() { try { S.overview = await api("/api/overview"); } catch (err) { S.overview = {error: (err && err.message) || "could not load"}; } drawOverview(); }
function barChart(daily) {
  const W = 720, H = 230, pl = 30, pb = 28, pt = 12, n = daily.length, ch = H - pt - pb;
  const peak = Math.max(1, ...daily.map(d => Math.max(d.clips, d.posted)));
  const step = Math.max(1, Math.ceil(peak / 4)), top = step * 4, cw = (W - pl) / n, bw = Math.min(14, (cw - 10) / 2);
  const y = v => pt + ch * (1 - v / top);
  let g = "";
  for (let i = 0; i <= 4; i++) g += `<line class="gl" x1="${pl}" x2="${W}" y1="${y(i * step)}" y2="${y(i * step)}"/><text x="${pl - 8}" y="${y(i * step) + 4}" text-anchor="end">${i * step}</text>`;
  daily.forEach((d, i) => {
    const cx = pl + i * cw + cw / 2, lab = new Date(d.day + "T12:00").toLocaleDateString([], {day:"numeric", month:"short"});
    g += `<g><title>${lab}: ${d.clips} clips made, ${d.posted} posted${d.views ? ", " + d.views.toLocaleString() + " views" : ""}</title>
      <rect class="b1" x="${cx - bw - 1}" y="${y(d.clips)}" width="${bw}" height="${Math.max(0, ch * d.clips / top)}" rx="3"/>
      <rect class="b2" x="${cx + 1}" y="${y(d.posted)}" width="${bw}" height="${Math.max(0, ch * d.posted / top)}" rx="3"/>
      <rect x="${pl + i * cw}" y="${pt}" width="${cw}" height="${ch}" fill="transparent"/></g>`;
    if (i % 2 === (n - 1) % 2) g += `<text x="${cx}" y="${H - 8}" text-anchor="middle">${i === n - 1 ? "Today" : lab}</text>`;
  });
  const none = daily.every(d => !d.clips && !d.posted) ? `<text class="none" x="${(W + pl) / 2}" y="${pt + ch / 2}" text-anchor="middle">No clips in the last 14 days</text>` : "";
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Clips made and posted per day, last 14 days">${g}${none}</svg>`;
}

async function loadReview() {
  const root = $("#rvroot"); if (!root) return;
  put(root, `<div class="set-load">Loading clips…</div>`);
  try {
    if (!S.jobs.length) S.jobs = await api("/api/jobs");
    const pickable = S.jobs.filter(j => (j.clips || []).some(c => c.status === "done"));
    if (!pickable.length) S.rv = {none: true};
    else {
      if (!pickable.some(j => j.id === S.rvJid)) S.rvJid = pickable[0].id;
      S.rv = await api(`/api/jobs/${encodeURIComponent(S.rvJid)}/review`);
    }
  } catch (err) { S.rv = {error: err.message}; }
  drawReview();
}

  return `<div class="card rv-card" data-cid="${esc(c.id)}">
    <div class="rv-thumb">${jpg ? `<img src="/media/${encodeURIComponent(S.rvJid)}/${esc(jpg)}" alt="" loading="lazy" onerror="this.remove()">` : ""}</div>
    <div class="rv-body">

      ${c.title && c.hook ? `<span class="sub">${esc(c.title)}</span>` : ""}
      <span class="sub">${score ? `<b class="rv-score">Score ${esc(score)} of 100</b> · ` : ""}${c.duration || c.end ? dur + " long" : ""}</span>

async function rvReview(jid, cid, review) {
  const list = rvList(), i = list.findIndex(c => String(c.id) === String(cid));
  const got = await send(`/api/jobs/${jid}/clips/${cid}`, {review}, "PATCH");
  if (i >= 0) Object.assign(list[i], (got && got.clip) || {review});
  toast(review === "approved" ? "Approved" : "Rejected", "ok");
  drawReview();
  rvAdvanceFrom(cid);
}
function rvAdvanceFrom(cid) {
  const list = rvList(), from = list.findIndex(c => String(c.id) === String(cid));
  for (let k = 1; k <= list.length; k++) {
    const c = list[(from + k) % list.length];
    if (rvUndecided(c)) return rvScrollTo(c.id);
  }
}
function rvSkip() {
  const cur = rvCursor(); if (!cur) return;
  rvAdvanceFrom(cur.id);
}
function rvScrollTo(cid) {
  const el = document.querySelector(`.rv-card[data-cid="${CSS.escape(String(cid))}"]`);
  if (el) el.scrollIntoView({behavior: "smooth", block: "nearest"});
}
function rvKeys(e) {
  const t = e.target;
  if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "SELECT" || t.isContentEditable)) return false;
  if (e.ctrlKey || e.metaKey || e.altKey) return false;
  const cur = rvCursor();
  if ((e.key === "a" || e.key === "A") && cur) { rvReview(S.rvJid, cur.id, "approved").catch(err => toast(err.message, "bad")); return true; }
  if ((e.key === "x" || e.key === "X") && cur) { rvReview(S.rvJid, cur.id, "rejected").catch(err => toast(err.message, "bad")); return true; }
  if (e.key === "s" || e.key === "S") { if (cur) rvSkip(); return !!cur; }
  return false;
}

/* The font picker: every caption font, drawn in its own letters.
 *
 * The old control was a text box. A person had to know a file name like "Anton-Regular", and a typo silently fell
 * back to the style's own face with nothing said, which is exactly the "not reliable" complaint. Now the list comes
 * from the server, each face is loaded from /assets/font/<file> and shown in the words it will draw, and the sad
 * case says so on the row instead of lying.

const brFontSeen = new Set();          // a font needs loading once, whatever the page repaints
function brLoadFace(f) {
  if (brFontSeen.has(f.file) || !document.fonts || !document.fonts.add) return;
  brFontSeen.add(f.file);
  try {
    const face = new FontFace(f.name, `url("${f.url}")`, { weight: "700" });
    face.load().then(ok => { document.fonts.add(ok); }).catch(() => { brFontSeen.delete(f.file); });
  } catch (e) { brFontSeen.delete(f.file); }
}
function brPaintFonts() {
  const sel = $("#br_font");
  const fonts = Array.isArray(S.captionFonts) ? S.captionFonts : [];
  if (!sel) return;
  const want = String((sel.dataset.saved || "") || "");
  sel.innerHTML = `<option value="">The style's own font</option>` +
    fonts.map(f => `<option value="${esc(f.name)}"${f.name === want ? " selected" : ""}>${esc(f.name)}</option>`).join("");
  const grid = $("#br_fontpick");
  if (!grid) return;
  if (!fonts.length) {
    grid.innerHTML = `<p class="hint">This server sent no font list, so only each style's own font is offered.</p>`;
    return;
  }
  grid.innerHTML = fonts.map(f => {
    brLoadFace(f);
    const sample = f.cjk ? "カレーを作る" : "Speed of the game";
    const on = f.name === want;
    return `<button type="button" class="fpick${on ? " on" : ""}" data-fpick="${esc(f.name)}" aria-pressed="${on ? "true" : "false"}">
      <span class="fpick-s" style="font-family:'${esc(f.name).replace(/'/g, "")}'">${esc(sample)}</span>
      <span class="fpick-n">${esc(f.name)}</span></button>`;
  }).join("");
  // A row is a choice, so the select and the cards cannot disagree.
  grid.onclick = (e) => {
    const b = e.target.closest("[data-fpick]");
    if (!b) return;
    sel.value = b.dataset.fpick;
    const now = b.dataset.fpick;
    grid.querySelectorAll(".fpick").forEach(x => {
      const hit = x.dataset.fpick === now;
      x.classList.toggle("on", hit);
      x.setAttribute("aria-pressed", hit ? "true" : "false");
    });
    brPreviewSoon();
  };
}

// hosts the same form. Every save handler goes through this, so a form in the main menu refreshes itself instead
