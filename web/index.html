// The trim bars under the two time boxes, the tapped words, the steps and the one-click cards. Everything here is
// additive: the fields the re-make button reads are the plain `[data-f]` controls above.
function wireEditor(j, c) {
  const dlg = $("#clipdlg");
  if (!dlg) return;
  const vid = () => $("#stage video");
  const start = $("#ed_start"), end = $("#ed_end"), ra = $("#ed_ra"), rb = $("#ed_rb"), len = $("#ed_len");
  const say = () => {
    if (!len) return;
    const a = Number(start.value) || 0, b = Number(end.value) || 0;
    len.textContent = b > a ? `${(b - a).toFixed(1)} seconds long` : "The end has to be after the start.";
    len.style.color = b > a ? "" : "var(--bad)";
  };
  const sync = () => {
    ra.value = String(Number(start.value) || 0);
    rb.value = String(Number(end.value) || 0);
    say();
    const v = vid();
    if (v && Number.isFinite(v.duration)) { const b = Number(end.value) || 0; if (b > 0) v.currentTime = Math.min(b, v.duration) - 0.001; }
  };
  start?.addEventListener("input", sync);
  end?.addEventListener("input", sync);
  ra?.addEventListener("input", () => { start.value = ra.value; say(); });
  rb?.addEventListener("input", () => { end.value = rb.value; say(); });
  say();

  // The words come from the clip's own transcript, in the video's seconds, so tapping one lands exactly where the
  // word is spoken instead of where a guess would put it.
  const box = $("#ed_words"), stamp = $("#ed_time");
  if (box) {
    api(`/api/jobs/${encodeURIComponent(D.jid)}/clips/${encodeURIComponent(D.cid)}/words`).then((got) => {
      if (!$("#ed_words")) return;
      const words = (got && got.words) || [];
      if (!words.length) {
        box.innerHTML = `<span class="ed-empty">${esc((got && got.note) || "This clip has no transcript words yet.")}</span>`;
        return;
      }
      // `l` is where the word is in the clip file being played, so tapping one lands on it; the printed
      // time is that same clip second, not the second of the whole video.
      box.innerHTML = words.map((w, i) => `<button type="button" class="ed-w" data-w="${i}" data-s="${w.l != null ? w.l : w.s}">${esc(w.w)}<span class="t">${mmss(w.l != null ? w.l : w.s)}</span></button>`).join("");
    }).catch((e) => {
      if (box) box.innerHTML = `<span class="ed-empty">${esc(e.message || "The words could not be read.")}</span>`;
    });
  }
  box?.addEventListener("click", (ev) => {
    const b = ev.target.closest("[data-w]");
    if (!b) return;
    const v = vid();
    if (v) { v.currentTime = Number(b.dataset.s) || 0; v.play?.().catch(() => {}); }
    box.querySelectorAll(".ed-w.on").forEach((x) => x.classList.remove("on"));
    b.classList.add("on");
  });
  const tick = () => { const v = vid(); if (v && stamp) stamp.textContent = mmss(v.currentTime); };
  dlg.addEventListener("timeupdate", tick, true);
  dlg.addEventListener("seeked", tick, true);

  // One step at a time. A step shows its pane (or two). The tab for each step is the button of its first pane.
  const tabs = Array.from(dlg.querySelectorAll("[data-pane]")).filter((b) => b.tagName === "BUTTON");
  const panes = Array.from(dlg.querySelectorAll(".ed-pane"));
  const paneBox = dlg.querySelector(".ed-panes");
  const stepOf = (name) => ED_STEPS.find((s) => s.panes.includes(name)) || ED_STEPS[0];
  const show = (name, keep) => {
    const step = stepOf(name);
    D.step = step.id;
    panes.forEach((pn) => {
      const on = step.panes.includes(pn.dataset.pane);
      pn.classList.toggle("on", on);
      if (on) pn.removeAttribute("hidden"); else pn.setAttribute("hidden", "");
    });
    tabs.forEach((b) => {
      const sel = b.dataset.pane === step.pane;
      b.setAttribute("aria-selected", String(sel));
      b.tabIndex = sel ? 0 : -1;
    });
    if (paneBox) paneBox.scrollTop = 0;
    // A pane that was hidden while a feature finished loading may have missed its own draw. Ask for one.
    if (!keep && window.PeakCut && PeakCut.repaint) { setTimeout(() => { try { PeakCut.repaint(); } catch { /* nothing worth a toast */ } }, 0); }
  };
  tabs.forEach((b) => b.addEventListener("click", () => show(b.dataset.pane)));
  // Arrow keys, Home and End move between the five visible steps.
  dlg.querySelector(".ed-railnav")?.addEventListener("keydown", (ev) => {
    const at = ED_STEPS.findIndex((s) => s.pane === ev.target?.dataset?.pane);
    if (at < 0) return;
    const to = ev.key === "ArrowRight" || ev.key === "ArrowDown" ? (at + 1) % ED_STEPS.length
      : ev.key === "ArrowLeft" || ev.key === "ArrowUp" ? (at + ED_STEPS.length - 1) % ED_STEPS.length
      : ev.key === "Home" ? 0 : ev.key === "End" ? ED_STEPS.length - 1 : -1;
    if (to < 0) return;
    ev.preventDefault();
    show(ED_STEPS[to].pane);
    dlg.querySelector(`.ed-railnav [data-pane="${ED_STEPS[to].pane}"]`)?.focus();
  });
  dlg.querySelectorAll("[data-jump]").forEach((b) => b.addEventListener("click", () => {
    const t = document.getElementById(b.dataset.jump);
    if (!t) return;
    const pane = t.closest(".ed-pane");
    show(pane ? pane.dataset.pane : "look", true);
    t.scrollIntoView({ block: "start", behavior: "smooth" });
  }));

  // One-click cards. They write into the same controls the re-make button reads, then say so with the events the
  // other pieces of the page already listen to. Nothing is sent or re-made until the person presses re-make.
  const field = (f) => dlg.querySelector(`[data-f="${f}"]`);
  const fire = (el) => { el.dispatchEvent(new Event("input", { bubbles: true })); el.dispatchEvent(new Event("change", { bubbles: true })); };
  const mark = () => {
    const cap = field("captions"), sty = field("style"), lay = field("layout");
    dlg.querySelectorAll("[data-preset]").forEach((b) => {
      const [kind, key] = b.dataset.preset.split(":");
      const on = kind === "caption" ? (key === "off" ? !!cap && !cap.checked : !!cap && cap.checked && !!sty && sty.value === key)
        : !!lay && lay.value === key;
      b.classList.toggle("on", on);
      b.setAttribute("aria-pressed", String(on));
    });
  };
  const root = dlg.querySelector(".editor") || dlg;
  root.addEventListener("click", (ev) => {
    const b = ev.target.closest ? ev.target.closest("[data-preset]") : null;
    if (!b) return;
    const [kind, key] = b.dataset.preset.split(":");
    if (kind === "layout") {
      const lay = field("layout");
      if (lay) { lay.value = key; fire(lay); }
    } else {
      const cap = field("captions"), sty = field("style");
      if (cap) { cap.checked = key !== "off"; fire(cap); }
      if (key !== "off" && sty) { sty.disabled = false; sty.value = key; fire(sty); }
    }
    mark();
  });

  // "Not saved yet" shows from the first change until the clip is re-made, which redraws this whole dialog.
  const dirty = $("#ed_dirty");
  const touched = (ev) => {
    const t = ev.target;
    if (!dirty || !t || !t.matches || !t.matches("[data-f], [data-note]")) return;
    dirty.hidden = false;
    mark();
  };
  root.addEventListener("input", touched);
  root.addEventListener("change", touched);

  mark();
  const keepStep = ED_STEPS.find((s) => s.id === D.step) || ED_STEPS[0];
  show(keepStep.pane, true);
}

// Minutes and seconds, for the transcript chips: a word at 84 s shows as 1:24.
function mmss(sec) {
  const s = Math.max(0, Math.floor(Number(sec) || 0));
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
}

function drawHist() {
  const box = $("#dlgvers");
  if (!box) return;
  const key = D.jid && D.cid ? D.jid + ":" + D.cid : "";
  const h = key ? S.clipHistory[key] : null;
  const vs = h && Array.isArray(h.versions) ? h.versions.filter(v => v && v.v > 0) : [];
  if (!vs.length) { box.hidden = true; box.innerHTML = ""; return; }
  const tip = v => {
    const bits = [v.bytes != null ? (v.bytes < 1048576 ? Math.max(1, Math.round(v.bytes / 1024)) + " KB" : (v.bytes / 1048576).toFixed(1) + " MB") : "",
                  v.made_at && !isNaN(new Date(v.made_at)) ? when(new Date(v.made_at).getTime() / 1000) : ""].filter(Boolean);
    return bits.join(" · ") || "Version " + v.v;
  };
  box.hidden = false;
  box.innerHTML = `<h3>Versions</h3><p class="help">Every take of this clip, oldest first. Click one to pin it as the keeper.</p>

async function loadHist() {
  const jid = D.jid, cid = D.cid, key = jid + ":" + cid;
  const c = jobOf(jid)?.clips.find(x => x.id === cid);
  const sig = c ? c.status + c.version : "";
  const had = S.clipHistory[key];
  if (had && had.sig === sig) return drawHist();
  try {
    const h = await api(`/api/jobs/${jid}/clips/${encodeURIComponent(cid)}/history`);
    S.clipHistory[key] = {sig, versions: h.versions, current: h.current};
  } catch (e) {
    if (!/not found|404/i.test(e.message || "")) {          // older jobs have no history; anything else gets a quiet retry line
      const b = $("#dlgvers");
      if (b) { b.hidden = false; b.innerHTML = `<p class="help">The versions could not be read. Open this clip again to retry.</p>`; }
      return;
    }
    S.clipHistory[key] = {sig, versions: [], current: 0};
  }

}

async function tick() {
  try {
    const got = await api("/api/sync?v=" + encodeURIComponent(S.syncV || ""));
    const fresh = !!got.jobs, stale = Date.now() - (S.ovAt || 0) > 20000;
    S.syncV = got.v;
    if (!fresh) {                                   // nothing of ours changed on the server
      if (S.view === "overview" && stale) { S.overview = await api("/api/overview"); S.ovAt = Date.now(); render(); }
      return;
    }
    const {jobs, creators, accounts} = got;
    // a server from before multi-channel support sends only `channel`: show it as that platform's channel
    creators.forEach(c => { if (!c.channels) { const u = c.channel || "", k = /youtu/i.test(u) ? "youtube" : /twitch/i.test(u) ? "twitch" : /kick/i.test(u) ? "kick" : ""; c.channels = k ? {[k]: u} : {}; } });
    S.jobs = jobs; S.creators = creators; S.accounts = accounts;
    if (got.ai) S.status.ai = got.ai;
    if (got.unread != null) S.status.unread = got.unread;
    if (S.view === "overview") { S.overview = await api("/api/overview"); S.ovAt = Date.now(); }
    if (S.view === "review" && S.rvJid) { try { S.rv = await api(`/api/jobs/${encodeURIComponent(S.rvJid)}/review`); } catch {} }
    if (creatorId() && !creator()) return go("overview");
    render();
  } catch {}
}
// Back on the tab (or window): ask straight away instead of waiting out the slow background timer, and put a
// live player that fell behind while hidden back at the live edge.
let hiddenAt = 0;
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { hiddenAt = Date.now(); return; }
  tick();
  if (hiddenAt && Date.now() - hiddenAt > 60000) {   // away a while: jump back to the live moment
    const pl = $("#stream .player"), f = pl?.querySelector("iframe");
    if (f) { const src = f.src; f.src = "about:blank"; requestAnimationFrame(() => { f.src = src; }); }
  }
  hiddenAt = 0;
});
window.addEventListener("focus", () => { if (!document.hidden) tick(); });
function loop() {
  const active = S.jobs.some(j => ["queued", "running", "live"].includes(j.status) || j.clips.some(c => c.status === "queued" || c.status === "rendering"));
  // quick while something is being made, relaxed otherwise, and slow when the tab is in the background
  const waiting = S.creators.some(c => (c.channels && Object.keys(c.channels).length && !c.profile?.pic) || c.live_job && !jobOf(c.live_job));
  setTimeout(async () => { await tick(); loop(); }, document.hidden ? 20000 : waiting ? 1000 : active ? 2000 : 4000);

    }
    if (a === "chadd") {
      const k = d.p, v = $("#chan_" + k)?.value.trim();
      if (!v) { $("#chan_" + k)?.focus(); return toast(`Paste their ${PLAT[k].name} channel link.`, "bad"); }
      const full = /^https?:\/\//.test(v) ? v : "https://" + v;
      return saveChannels({...creator().channels, [k]: full});
    }
    if (a === "chdel") { const chs = {...creator().channels}; delete chs[d.p]; return saveChannels(chs); }
    if (a === "spick") { S.spick = {...S.spick, [creatorId()]: d.p}; return drawStream(); }
    if (a === "chmain") return saveChannels(creator().channels, creator().channels[d.p]);
    if (a === "golive") {
      if (!creator().channel) { setTab("setup"); return toast("Connect one of their channels first, then press Start recording.", "bad"); }
      b.disabled = true; const was = b.innerHTML; b.innerHTML = `<span class="rdot"></span>Starting…`;
      try {
        // The creator is fixed before asking: starting can take a few seconds, and the person may open another
        // creator meanwhile. The recording must stay with the one whose button was pressed.
        const cid0 = creatorId();
        const j = await send(`/api/creators/${cid0}/live`, d.url ? {channel: d.url} : {});
        if (j?.id) { const c = S.creators.find(x => x.id === cid0); if (c) c.live_job = j.id; if (!jobOf(j.id)) S.jobs.unshift(j); render(); }
        const still = creatorId() === cid0;
        toast(still ? "Recording started. Clips appear below as they're made." : `Recording started for ${S.creators.find(x => x.id === cid0)?.name || "that creator"}.`, "ok");
        if (still) setTab("clips");
      } catch (e) { b.disabled = false; b.innerHTML = was; throw e; }
      return tick();
    }
    if (a === "stoplive") {
      if (!await ask("Stop recording?", "Clips already made are kept. The rest of the buffer is cleared.", "Stop recording", true)) return;
      const j = jobOf(d.j); if (j) { j.status = "done"; j.stage = "Stopped by you"; }
      S.creators.forEach(c => { if (c.live_job === d.j) c.live_job = null; }); render();
      toast("Recording stopped. Clips already made are kept.", "ok");
      api(`/api/live/${d.j}/stop`, {method:"POST"}).catch(e => toast(e.message, "bad")).finally(tick); return;
    }
    if (a === "clipnow") { await send(`/api/live/${d.j}/clip`, {seconds:Number(d.s)}); return toast(`Clipping the last ${d.s} seconds…`, "ok"); }
    if (a === "resendverify") {
      b.disabled = true;
      try { const r = await send("/api/auth/resend-verification"); if (r.verified) { S.status = await api("/api/status"); drawShell(); return toast("Your email is already confirmed.", "ok"); }
        toast(r.mail_ready ? `New link sent to ${S.status.user.email}. Check your spam folder too.` : "Email isn't set up on this server yet, so the link was written to the server log.", r.mail_ready ? "ok" : "bad"); }
      catch (e) { toast(e.message, "bad"); }
      b.disabled = false; return;
    }
    if (a === "tour") return startTour();
    if (a === "settab") { e.preventDefault(); S.stab = d.k; remember("settings", d.k); return refreshHost(); }
    if (a === "updhow") return updateHow();
    if (a === "updlater") { try { localStorage.setItem("peakcut_update_seen", S.status.update?.latest || ""); } catch {} return drawShell(); }
    if (a === "storopen") { await send("/api/storage/open"); return; }
    if (a === "storchange") { S.storOpen = !S.storOpen; S.storNew = ""; return refreshHost(); }
    if (a === "storpick") {
      b.disabled = true;
      try { const r = await send("/api/storage/pick"); if (r.path) { S.storNew = r.path; $("#stor_new").value = r.path; } } finally { b.disabled = false; }
      return;
    }
    if (a === "storsave") {
      const s = await send("/api/storage", {path: $("#stor_new").value, move: $("#stor_move").checked}, "PUT");
      S.storOpen = false; toast("Saved. Close Clipstorm and start it again to switch to the new folder.", "ok"); return refreshHost();
    }
    if (a === "storcancel") { await send("/api/storage", {cancel: true}, "PUT"); toast("Kept the current folder", "ok"); return refreshHost(); }
    if (a === "appsetup") { S.setupOpen = d.p && S.setupOpen !== d.p ? d.p : ""; return refreshHost(); }
    if (a === "copytext") { await navigator.clipboard.writeText(d.t); return toast("Copied", "ok"); }
    if (a === "appsave") {
      await send("/api/apps", {platform: d.p, client_id: $("#app_id").value, client_secret: $("#app_secret").value}, "PUT");
      S.setupOpen = ""; S.status = await api("/api/status"); toast("Saved. People can connect now.", "ok"); return refreshHost();
    }
    if (a === "zsetup") { S.zOpen = !S.zOpen; return refreshHost(); }
    if (a === "zsave") {
      const key = ($("#z_key") || {}).value || "";
      if (!key.trim() && !(S.zernio || {}).has_key) return toast("Paste the key first.", "bad");
      await send("/api/zernio", key.trim() ? {key} : {}, "PUT");
      let got = null, why = "";
      try { got = await send("/api/zernio/test", {}, "POST"); } catch (err) { why = err.message; }
      S.zOpen = false; S.zernio = await api("/api/zernio");
      S.accounts = await api("/api/accounts").catch(() => S.accounts || []);
      toast(got ? (got.accounts ? `Saved. ${got.accounts} account${got.accounts === 1 ? "" : "s"} connected through Zernio.` : "Saved. No accounts are connected on Zernio yet.") : `Saved, but the test failed. ${why}`, got ? "ok" : "bad");
      return refreshHost();
    }
    if (a === "zforget") {
      if (!await ask("Remove the Zernio key?", "Clips already queued for Zernio accounts will fail. You can paste a key again any time.", "Remove it", true)) return;
      await send("/api/zernio", {forget_key:true}, "PUT");
      S.zernio = await api("/api/zernio"); S.accounts = await api("/api/accounts").catch(() => []);
      return refreshHost();
    }
    if (a === "zrefresh") {
      await api("/api/zernio/accounts?refresh=true").catch(() => null);
      S.accounts = await api("/api/accounts").catch(() => S.accounts || []);
      S.zernio = await api("/api/zernio");
      toast("Account list refreshed", "ok"); return refreshHost();
    }
    if (a === "bell") return openBell();
    if (a === "feedback") return openFeedback("bug");
    if (a === "report") return openFeedback("bug", d.ctx);
    if (a === "acctmenu") return openAcct();
    if (a === "bellread") { await markRead(); return openBell(); }
    if (a === "ntgo") { closePops(); const l = d.link || ""; if (l.startsWith("/app")) { const [v, tab] = fromPath(l); return go(v, tab); } if (l.startsWith("/")) location.href = l; return; }
    if (a === "csave") return void await saveCreator();
    if (a === "cdiscard") { drawCreatorForm(); return toast("Changes discarded"); }
    if (a === "pause") { await send("/api/settings", {paused:!S.overview.paused}, "PUT"); return loadOverview(); }
    if (a === "pcancel" || a === "pretry") { await api(`/api/posts/${d.id}/${a === "pcancel" ? "cancel" : "retry"}`, {method:"POST"}); return loadOverview(); }
    if (a === "ssave") { await saveSettings(); toast("Saved", "ok"); return refreshHost(); }
    if (a === "plansave") {
      const p = {}; $$("#sform [data-plan]").forEach(i => { (p[i.dataset.plan] ??= {})[i.dataset.f] = Number(i.value); });
      await send("/api/settings", {plans:p}, "PUT"); S.status = await api("/api/status"); toast("Plans saved", "ok"); return refreshHost();
    }
    if (a === "testalert") { await saveSettings(); await api("/api/alerts/test", {method:"POST"}); return toast("Test message sent. Check your phone.", "ok"); }
    if (a === "accremove") {
      if (!await ask("Disconnect this account?", "Posts still waiting for it will fail.", "Disconnect", true)) return;
      await api(`/api/accounts/${d.id}`, {method:"DELETE"}); await tick(); return refreshHost();
    }
    if (a === "remake") {
      const body = {}; $$("#clipdlg [data-f]").forEach(i => {
        body[i.dataset.f] = i.type === "checkbox" ? i.checked : i.type === "number" ? Number(i.value) : i.value;
      });
      await send(`/api/jobs/${D.jid}/clips/${D.cid}/render`, body); toast("Re-making the clip…", "ok"); return tick();
    }
    if (a === "noteclip") {
      const note = ($("#clipdlg [data-note]") || {}).value || "";
      if (!note.trim()) return toast("Write what to change first.", "bad");
      const got = await send(`/api/jobs/${D.jid}/clips/${D.cid}/edit`, {text: note});
      toast(got.note || "Change put on the clip. Press re-make to see it.", "ok");
      if (got.clip) { const c = jobOf(D.jid)?.clips.find(x => x.id === D.cid); if (c) Object.assign(c, got.clip); }
      return drawClipDlg(true);
    }
    if (a === "transclip") {
      const lang = ($("#clip_lang") || {}).value || "";
      if (!lang) return toast("Pick a language first.", "bad");
      const got = await send(`/api/jobs/${D.jid}/clips/${D.cid}/translate`, {lang});
      toast(`Captions are now in ${(S.langs || {})[got.lang] || got.lang}. Press re-make to draw them.`, "ok");
      if (got.clip) { const c = jobOf(D.jid)?.clips.find(x => x.id === D.cid); if (c) Object.assign(c, got.clip); }
      return drawClipDlg(true);
    }
    if (a === "rvapprove" || a === "rvreject") { await rvReview(d.jid, d.cid, a === "rvapprove" ? "approved" : "rejected"); return; }
    if (a === "rvskip") { if (d.cid) return rvAdvanceFrom(d.cid); return rvSkip(); }
    if (a === "rvreload") return loadReview();
    if (a === "ovreload") return loadOverview();
    if (a === "peekclip") {
      const box = $("#peekbox");
      if (box) box.innerHTML = `<span class="making">Taking a look…</span>`;
      const got = await send(`/api/jobs/${D.jid}/peek`, {cid: D.cid});
      const mine = (got.frames || []).find(f => String(f.id) === String(D.cid)) || (got.frames || [])[0];
      if (!box) return;
      if (!mine || mine.error) return box.innerHTML = `<p class="help">${esc((mine && mine.error) || "No frames came back.")}</p>`;
      box.innerHTML = `<img src="/api/jobs/${encodeURIComponent(D.jid)}/peek/${encodeURIComponent(D.cid)}?v=${Date.now()}" alt="Still frames from this clip">`;
      return;
    }
    if (a === "postnow" || a === "postqueue") {
      const accs = $$("#clipdlg [data-pacc]:checked").map(i => i.value);
      if (!accs.length) return toast("Tick at least one account first.", "bad");
      if (a === "postnow" && !await ask("Post now?", `This clip goes to ${accs.length} account${accs.length > 1 ? "s" : ""} straight away.`, "Post now")) return;
      await send("/api/posts", {job:D.jid, clip:D.cid, accounts:accs, now:a === "postnow"});
      toast(a === "postnow" ? "Posting now" : "Added to the queue", "ok"); return tick();
    }
  } catch (err) { b.disabled = false; toast(err.message, "bad"); }
});

$("#collapseBtn").innerHTML = ic("sidebar"); $("#menuBtn").innerHTML = ic("menu");
try { if (localStorage.getItem("mini")) $("#app").classList.add("mini"); } catch {}
$("#main").addEventListener("scroll", () => $(".topbar").classList.toggle("stuck", $("#main").scrollTop > 4), {passive:true});
(async () => {
  try { S.status = await api("/api/status"); } catch {}
  // Languages the clip editor can translate into, and whether this server has the engine at all.
  try {
    const langs = await api("/api/translate/langs");
    const named = {}; Object.keys(langs).forEach(k => { if (k !== "available" && langs[k]) named[k] = langs[k]; });
    if (Object.keys(named).length) S.langs = named;
    S.canTranslate = langs.available !== false;
  } catch { S.canTranslate = null; }
  const q = new URLSearchParams(location.search);
  if (q.get("connected") || q.get("connect_error")) {
    const ok = q.get("connected"), err = q.get("connect_error"), nm = q.get("name");
    history.replaceState(null, "", location.pathname);
    setTimeout(() => ok ? toast(`${nm || ok} is connected. Pick it in a creator's Setup to post there.`, "ok") : toast(err, "bad"), 300);
  }
  if (q.get("verified")) { history.replaceState(null, "", location.pathname); setTimeout(() => toast("Email confirmed. You're ready to clip.", "ok"), 300); }
  if (q.get("verify_error")) { history.replaceState(null, "", location.pathname); setTimeout(() => toast(q.get("verify_error"), "bad"), 300); }
  if (location.pathname.startsWith("/app/")) { const [v, tab] = fromPath(location.pathname); S.view = v; S.ctab = tab; }  // the address decides, before anything loads
  await tick();
  { const [v, tab] = location.pathname.startsWith("/app/") ? fromPath(location.pathname) : ["overview", "clips"]; go(v, tab, true);
    // The address is left exactly as it arrived. A page a feature file owns is not known yet at this
    // point (that file has not loaded), so rewriting it here would throw the deep link away; the loader
    // reads the address again once the feature files are in and either opens that page or, if nothing
    // owns the address, quietly settles on the home page.
  }
  try {  // a link pasted on the home page before signing up
    const link = sessionStorage.getItem("peakcut_link");
    if (link) { sessionStorage.removeItem("peakcut_link"); go("overview"); $("#url").value = link; onLink($("#url")); $("#url").focus(); toast("Your link is ready. Press Make clips.", "ok"); }
  } catch {}
  loop();
  if (S.status.tour && !$("#formdlg").open) setTimeout(startTour, 500);   // once, the first time someone signs in
  checkNew(true);
  setInterval(async () => { try { S.status = await api("/api/status"); drawShell(); if (S.view === "overview") drawOverview(); checkNew(); } catch {} }, 15000);
})();
</script>
</body>
</html>
